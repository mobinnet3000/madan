name: Auto Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          cp .htaccess dist/.htaccess || cp frontend/.htaccess dist/.htaccess 2>/dev/null || true
          ls -la dist/

      - name: Deploy frontend to cPanel (dist + .htaccess)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          local-dir: ./frontend/dist/
          server-dir: /madan.ba3tani.ir/
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Trigger cPanel Git Pull (backend)
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          if [ -z "$CPANEL_HOST" ] || [ -z "$CPANEL_USER" ] || [ -z "$CPANEL_TOKEN" ]; then
            echo "::warning::CPANEL_* secrets not set — skipping backend pull (frontend already deployed)."
            exit 0
          fi
          set -e
          resp=$(curl -sk -u "$CPANEL_USER:$CPANEL_TOKEN" "https://$CPANEL_HOST:2083/execute/VersionControl/update?repository_root=%2Fhome%2F$CPANEL_USER%2Fmback.ba3tani.ir")
          echo "$resp"
          echo "$resp" | grep -q '"status": *1' || { echo "::warning::cPanel pull may have failed — check response above."; exit 0; }

      - name: Post-deploy reminder
        if: always()
        run: |
          echo "Frontend: uploaded to /madan.ba3tani.ir/ (dist + .htaccess)"
          echo "Backend: pulled via cPanel Git — if models changed, run on server: python backend/manage.py migrate && python backend/manage.py collectstatic --noinput && restart Passenger"
