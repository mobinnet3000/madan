name: Auto Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          echo "dist built:" && ls -lh dist/ | head -20

      - name: Try cPanel Git Pull via API (auto)
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          if [ -z "$CPANEL_HOST" ] || [ -z "$CPANEL_TOKEN" ]; then
            echo "::notice::CPANEL_HOST/TOKEN not set — skipping API pull."
            echo "Site will update after you click Pull/Deploy in cPanel -> Git Version Control"
            echo "Or set secrets CPANEL_HOST/CPANEL_USER/CPANEL_TOKEN to make it fully automatic."
            exit 0
          fi
          RESP=$(curl -sk -u "$CPANEL_USER:$CPANEL_TOKEN" \
            "https://$CPANEL_HOST:2083/execute/VersionControl/update?repository_root=%2Fhome%2F$CPANEL_USER%2Fmback.ba3tani.ir")
          echo "$RESP"
          echo "$RESP" | grep -q '"status":1' && echo "cPanel pull triggered — .cpanel.yml tasks will run (pip/migrate/collectstatic/frontend copy)" || echo "::warning::cPanel API failed — pull manually in cPanel"

      - name: FTP deploy frontend (fallback if API not configured)
        if: ${{ secrets.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          local-dir: ./frontend/dist/
          server-dir: ${{ secrets.FTP_FRONTEND_DIR || '/madan.ba3tani.ir/' }}
          exclude: |
            **/.git*
            **/node_modules/**
          dry-run: false
          log-level: minimal
